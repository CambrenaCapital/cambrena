    <meta property="og:locale" content="en_US" />

    <!-- Structured Data for SEO -->

      "logo": "https://cambrena.net/logo.jpg",
      "description": "We back exceptional founders and businesses across venture and growth equity stages, using capital that isn't bound by traditional fund constraints",

        "addressCountry": "CH",

      "vatID": "CHE-174.199.372"

    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialService",
      "name": "Cambrena Capital",
      "image": "https://cambrena.net/logo.jpg",
      "description": "Early-stage venture capital investor providing funding for startups",
      "address": {

        "addressCountry": "CH"
      },

        "latitude": "47.1926",
        "longitude": "8.5231"
      },
      "url": "https://cambrena.net",
      "email": "contact@cambrena.net",
      "areaServed": {

        "name": "Switzerland"
      },
      "sameAs": [
        "https://www.linkedin.com/company/cambrena-capital/"
      ]
    }
    </script>

    <!-- GitHub Pages SPA redirect script -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
